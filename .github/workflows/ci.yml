name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    # Détecte une rupture de contrat amont (RCP / Stripe) avant les utilisateurs.
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Standards et analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: PHPCS
        run: vendor/bin/phpcs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Traçabilité des exigences
        # Échoue si la matrice versionnée n'est plus à jour, ou si une exigence
        # du cahier des charges n'est établie par rien.
        run: php bin/traceability.php --check
      - name: Conformité PSR-4
        # Un fichier dont le chemin ne reproduit pas la casse de son espace de
        # noms reste autochargeable sur macOS et introuvable sur Linux. Le
        # défaut ne se voit donc qu'ici.
        run: |
          composer dump-autoload --optimize --strict-psr --no-interaction 2>&1 | tee /tmp/psr4.txt
          ! grep -q "does not comply with psr-4" /tmp/psr4.txt

  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Audit des dépendances PHP
        run: composer audit --abandoned=ignore
      - name: Aucun secret, aucun IBAN réel (CDC T-SEC-12)
        run: bash bin/scan-secrets.sh
      - name: Aucun test ignoré ni marqueur de substitution (CDC NR-05)
        run: bash bin/scan-placeholders.sh

  unit:
    name: Unitaires — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2
      - name: Dépendances
        # Le verrou Composer est résolu sur PHP 8.2 : PHPUnit y tire des
        # paquets qui exigent PHP 8.1. Sur les versions antérieures, laisser
        # Composer résoudre un outillage compatible — le plugin, lui, reste
        # tenu à PHP 7.4, ce que vérifie PHPCompatibility dans la tâche de
        # standards.
        run: |
          if [ "${{ matrix.php }}" = "7.4" ] || [ "${{ matrix.php }}" = "8.0" ]; then
            composer update --no-interaction --prefer-dist
          else
            composer install --no-interaction --prefer-dist
          fi
      - run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Intégration — WP ${{ matrix.wp }} / RCP ${{ matrix.rcp }} (libre)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: ['latest', '6.7']
        rcp: ['latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Installer Subversion
        # La bibliothèque de tests de WordPress ne se récupère qu'en SVN, et le
        # runner n'embarque pas le client. L'image Docker, elle, l'inclut.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Installer la bibliothèque de tests WordPress
        env:
          WP_VERSION: ${{ matrix.wp }}
          RCP_VERSION: ${{ matrix.rcp }}
          RCP_VARIANT: free
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: root
        run: bash bin/install-wp-tests.sh
      - run: vendor/bin/phpunit --testsuite integration
      - run: vendor/bin/phpunit --testsuite contract
        env:
          STRIPE_MOCK_HOST: 127.0.0.1
      - run: vendor/bin/phpunit --testsuite webhooks
      # La couverture agrège toutes les suites : elle exige WordPress et RCP,
      # et n'est donc mesurée qu'ici, sur la combinaison principale.
      - name: Couverture fusionnée
        if: matrix.wp == 'latest'
        env:
          STRIPE_MOCK_HOST: 127.0.0.1
        run: bash bin/coverage.sh
      - name: Contrôle du seuil (80 %)
        if: matrix.wp == 'latest'
        run: bash bin/check-coverage.sh tests/coverage/clover.xml 80
      - name: Publier le rapport de couverture
        if: matrix.wp == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/coverage/html

  integration-pro:
    name: Intégration — Restrict Content Pro
    runs-on: ubuntu-latest
    # L'archive de RCP Pro est un produit commercial : elle ne peut pas être
    # versionnée. Ce job ne s'exécute que si l'URL de téléchargement est
    # configurée en secret de dépôt, et il n'est jamais bloquant pour une
    # contribution externe.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence du secret
        id: guard
        run: |
          if [ -z "${{ secrets.RCP_PRO_ARCHIVE_URL }}" ]; then
            echo "Secret RCP_PRO_ARCHIVE_URL absent — job ignoré."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: shivammathur/setup-php@v2
        if: steps.guard.outputs.run == 'true'
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - if: steps.guard.outputs.run == 'true'
        run: composer install --no-interaction --prefer-dist
      - name: Récupérer l'archive Restrict Content Pro
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir -p vendor-plugins
          curl -sSLf "${{ secrets.RCP_PRO_ARCHIVE_URL }}" -o vendor-plugins/restrict-content-pro.zip
      - name: Installer Subversion
        if: steps.guard.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Installer la bibliothèque de tests WordPress
        if: steps.guard.outputs.run == 'true'
        env:
          WP_VERSION: latest
          RCP_VARIANT: pro
          VENDOR_PLUGINS_DIR: ${{ github.workspace }}/vendor-plugins
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: root
        run: bash bin/install-wp-tests.sh
      - name: Tests d'intégration, de contrat et de webhooks
        if: steps.guard.outputs.run == 'true'
        env:
          STRIPE_MOCK_HOST: 127.0.0.1
        run: |
          vendor/bin/phpunit --testsuite integration
          vendor/bin/phpunit --testsuite contract
          vendor/bin/phpunit --testsuite webhooks
      - name: Purger l'archive commerciale
        if: always()
        run: rm -rf vendor-plugins

  i18n:
    name: Fichier .pot à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli
      - run: wp i18n make-pot . languages/rcp-stripe-sepa.pot --slug=rcp-stripe-sepa --exclude=vendor,tests,ressources,node_modules,stubs,build
      - name: Échouer si le .pot a changé
        run: |
          # `POT-Creation-Date` change à chaque génération : la comparer
          # ferait échouer la tâche même sur un fichier parfaitement à jour.
          ignore='^"POT-Creation-Date:'
          git diff -I"$ignore" --quiet -- languages/rcp-stripe-sepa.pot \
            || { echo "Le fichier .pot n'est pas à jour. Régénérez-le."; git diff -I"$ignore" -- languages/; exit 1; }
