services:

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Base dédiée à la suite d'intégration : en mémoire, réinitialisée à chaque exécution.
  db-tests:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: ./docker/wordpress
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'DISABLE_WP_CRON', true );
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
        /* Secrets de webhook : jamais en base en développement. */
        define( 'RCP_SEPA_WEBHOOK_SECRET_TEST', getenv( 'STRIPE_WEBHOOK_SECRET' ) ?: '' );
    volumes:
      - wp-data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/rcp-stripe-sepa
      - ./vendor-plugins:/vendor-plugins:ro

  wpcli:
    build:
      context: ./docker/wordpress
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
      db-tests:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WP_TESTS_DB_HOST: db-tests
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      # Volume persistant : chaque `docker compose run` crée un conteneur neuf,
      # /tmp ne survivrait pas d'une commande à l'autre.
      WP_TESTS_DIR: /wp-tests/lib
      WP_CORE_DIR: /wp-tests/core
      RCP_VARIANT: ${RCP_VARIANT:-free}
      VENDOR_PLUGINS_DIR: /vendor-plugins
      # URL publique, telle qu'atteinte depuis le navigateur de l'hôte.
      WP_URL: http://localhost:${WP_PORT:-8080}
      RCP_VERSION: ${RCP_VERSION:-latest}
      WP_VERSION: ${WP_VERSION:-latest}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MOCK_HOST: stripe-mock
    volumes:
      - wp-data:/var/www/html
      - test-data:/wp-tests
      - ./:/var/www/html/wp-content/plugins/rcp-stripe-sepa
      - ./vendor-plugins:/vendor-plugins:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["sleep infinity"]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Relais des webhooks Stripe vers le point de terminaison du plugin.
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    depends_on:
      - wordpress
    environment:
      STRIPE_API_KEY: ${STRIPE_TEST_SECRET_KEY:-}
    command:
      - listen
      - --forward-to
      - http://wordpress/wp-json/rcp-stripe-sepa/v1/webhook
      - --events
      - payment_intent.processing,payment_intent.succeeded,payment_intent.payment_failed,setup_intent.succeeded,setup_intent.setup_failed,invoice.paid,invoice.payment_failed,invoice.payment_action_required,charge.dispute.created,charge.refunded,mandate.updated,customer.subscription.updated,customer.subscription.deleted

  # API Stripe bouchonnée : tests de contrat hors ligne, sans clé ni réseau.
  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "${STRIPE_MOCK_PORT:-12111}:12111"

volumes:
  db-data:
  wp-data:
  test-data:
