; `docker-php-ext-enable xdebug` a déjà écrit la directive `zend_extension`
; dans docker-php-ext-xdebug.ini : la répéter ici provoque un avertissement
; « Cannot load Xdebug - it was already loaded » sur chaque exécution de PHP,
; qui pollue la sortie de tous les scripts en ligne de commande.
xdebug.mode=coverage,debug
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.max_nesting_level=512
